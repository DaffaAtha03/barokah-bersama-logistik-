# Monitoring situs: tiap 6 jam memeriksa semua halaman. Bila gagal, otomatis membuat Issue
# (GitHub mengirim email ke pemilik repo) dan menutupnya sendiri saat situs pulih.
name: Monitoring situs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - id: url
        name: Tentukan URL situs
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          URL="$SITE_URL_VAR"
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          fi
          if [ -z "$URL" ]; then
            echo "::error::URL situs tidak ditemukan. Aktifkan GitHub Pages atau buat variabel repo SITE_URL."
            exit 1
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - id: check
        name: Periksa situs
        continue-on-error: true
        run: python3 scripts/check_live.py "${{ steps.url.outputs.url }}"

      - name: Buka / perbarui Issue bila ada masalah
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          TITLE="🚨 Situs tidak sehat"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf 'Pemeriksaan otomatis menemukan masalah pada **%s**.\n\n```\n%s\n```\n\n[Lihat detail pemeriksaan](%s)\n' "${{ steps.url.outputs.url }}" "$REPORT" "$RUN_URL")
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Tutup Issue otomatis saat situs pulih
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Situs tidak sehat"
          for NUM in $(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number'); do
            gh issue close "$NUM" --repo "${{ github.repository }}" --comment "✅ Situs sudah pulih (pemeriksaan otomatis berhasil)."
          done

      - name: Gagalkan job bila situs bermasalah
        if: steps.check.outcome == 'failure'
        run: exit 1
