# Deploy otomatis ke GitHub Pages setiap ada perubahan di cabang "main"
# (termasuk perubahan yang dibuat lewat panel admin /admin/).
name: Deploy situs

on:
  push:
    branches: [main]
    # Catatan: JANGAN mengabaikan "**/*.md" — artikel di content/artikel/*.md harus memicu deploy.
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy dalam satu waktu; deploy lama yang belum selesai dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      # Cache gambar hasil optimasi agar build berikutnya sangat cepat.
      - uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('static/uploads/**', 'build.py') }}
          restore-keys: images-

      - name: Jalankan pengujian
        run: python -m unittest discover -s tests -v

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build situs
        env:
          # base_url otomatis benar untuk github.io/<repo> maupun domain sendiri.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build.py

      - name: Periksa hasil build (tautan, SEO, aksesibilitas)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/check_site.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
