{% macro page_hero(title, intro, crumb) %}
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="{{ u('/') }}">Home</a><span aria-hidden="true">/</span><span aria-current="page">{{ crumb or title }}</span>
    </nav>
    <h1>{{ title }}</h1>
    {% if intro %}<p class="lead">{{ intro }}</p>{% endif %}
  </div>
</section>
{% endmacro %}

{% macro cta_band(title, text) %}
<section class="cta-band">
  <div class="container cta-inner reveal">
    <div>
      <h2>{{ title }}</h2>
      <p>{{ text }}</p>
    </div>
    <div class="btn-row">
      <a class="btn btn-light btn-lg" href="{{ u('/kontak/') }}#formulir">Minta Penawaran</a>
      <a class="btn btn-outline-light btn-lg" href="{{ wa_url() }}" target="_blank" rel="noopener noreferrer">{{ icon('whatsapp') }} WhatsApp</a>
    </div>
  </div>
</section>
{% endmacro %}
